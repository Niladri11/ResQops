name: DR — Trigger Failover

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for DR trigger'
        required: false
        default: 'Manual trigger'

jobs:
  dr-failover:
    name: Activate DR Region
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify DR EC2 is running
        run: |
          aws ec2 describe-instances \
            --region ap-southeast-1 \
            --query 'Reservations[*].Instances[*].[InstanceId,State.Name,PublicIpAddress]' \
            --output table

      - name: Health check DR endpoint
        run: |
          DR_IP=$(aws ec2 describe-instances \
            --region ap-southeast-1 \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)
          echo "DR EC2 IP: $DR_IP"
          sleep 5
          curl -f http://$DR_IP:5000/health
          echo "DR region is healthy and serving traffic"

      - name: Notify Slack DR Activated
        run: |
          curl -X POST '${{ secrets.SLACK_WEBHOOK_URL }}' \
          -H 'Content-type: application/json' \
          --data '{
            "text": "✅ *DR ACTIVATED* — ResQOps is now serving from *ap-southeast-1 Singapore*. Primary region recovery in progress."
          }'
