global:
  resolve_timeout: 1m
  slack_api_url: 'SLACK_WEBHOOK_URL_PLACEHOLDER'

route:
  receiver: 'slack-and-dr'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'slack-and-dr'
    slack_configs:
      - channel: '#resqops-alerts'
        title: '{{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} — {{ .GroupLabels.alertname }}'
        text: |
          *Status:* {{ .Status | toUpper }}
          *Severity:* {{ .CommonLabels.severity }}
          {{ if eq .Status "firing" }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ else }}
          *Summary:* ResQOps API recovered and is back UP ✅
          *Description:* Primary region ap-south-1 is healthy.
          {{ end }}
        send_resolved: true
    webhook_configs:
      - url: 'http://host.docker.internal:9099'
        send_resolved: false

